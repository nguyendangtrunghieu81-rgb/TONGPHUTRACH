<html lang="vi">

  <title>Trợ lý Tổng phụ trách Đội THCS</title>
  <style>

    .app{display:grid;grid-template-columns:var(--sidebar) 1fr;grid-template-rows:var(--top) 1fr;height:100%}.sidebar{grid-row:1/3;background:#0a3764;color:#fff;display:flex;flex-direction:column;min-width:0;z-index:20}.brand{height:var(--top);display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid rgba(255,255,255,.12)}.brand-mark{display:grid;place-items:center;width:34px;height:34px;border-radius:9px;background:#fff;color:var(--blue);font-weight:900}.brand-text{min-width:0}.brand-text strong{display:block;font-size:13px;line-height:1.2}.brand-text span{font-size:10.5px;color:#cfe4f7}.nav{overflow:auto;padding:8px 7px 16px;scrollbar-width:thin}.nav button{width:100%;display:flex;align-items:center;gap:10px;border:0;background:transparent;color:#dceaf7;padding:8px 10px;border-radius:7px;text-align:left;margin:1px 0;min-height:37px}.nav button:hover{background:rgba(255,255,255,.08);color:#fff}.nav button.active{background:#fff;color:#0a4f91;font-weight:700}.nav .ico{width:20px;text-align:center;font-size:15px}.nav .nav-label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sidebar-foot{margin-top:auto;padding:10px;border-top:1px solid rgba(255,255,255,.12);font-size:11px;color:#cfe4f7}.sidebar.collapsed{width:64px}.app:has(.sidebar.collapsed){grid-template-columns:64px 1fr}.sidebar.collapsed .brand-text,.sidebar.collapsed .nav-label,.sidebar.collapsed .sidebar-foot{display:none}.sidebar.collapsed .nav button{justify-content:center}.sidebar.collapsed .brand{justify-content:center}
    .topbar{grid-column:2;height:var(--top);display:flex;align-items:center;gap:8px;padding:8px 14px;background:#fff;border-bottom:1px solid var(--line);z-index:10;min-width:0}.icon-btn,.btn{border:1px solid var(--line);background:#fff;border-radius:8px;min-height:36px;padding:7px 11px;font-weight:650}.icon-btn{width:38px;padding:0;display:grid;place-items:center}.btn:hover,.icon-btn:hover{border-color:#a8bacb;background:#f8fafc}.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}.btn.primary:hover{background:var(--blue2)}.btn.success{background:var(--green);color:#fff;border-color:var(--green)}.btn.danger{color:var(--red);border-color:#efb1b1}.btn.small{min-height:30px;padding:4px 8px;font-size:12px}.context-select{height:36px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:0 26px 0 8px;max-width:145px}.searchbox{position:relative;min-width:150px;flex:1;max-width:320px}.searchbox input{width:100%;height:36px;border:1px solid var(--line);border-radius:8px;padding:0 34px 0 10px}.status-line{margin-left:auto;display:flex;align-items:center;gap:7px;white-space:nowrap;font-size:12px;color:var(--muted)}.dot{width:8px;height:8px;border-radius:50%;background:var(--green)}.dot.off{background:var(--red)}.save-state{padding:5px 8px;border-radius:14px;background:var(--green-soft);color:#126c4b}.sync-state{padding:5px 8px;border-radius:14px;background:#f2f4f7;color:#4e5b6a}
    .content{grid-column:2;overflow:auto;padding:14px}.page{display:none;max-width:1600px;margin:0 auto}.page.active{display:block}.page-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px}.page-head h1{font-size:21px;line-height:1.25;margin:0 0 3px}.page-head p{margin:0;color:var(--muted);font-size:12.5px}.page-actions{margin-left:auto;display:flex;gap:7px;flex-wrap:wrap}.toolbar{display:flex;align-items:center;gap:7px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);padding:8px;border-radius:var(--radius);margin-bottom:10px}.toolbar input,.toolbar select{height:34px;border:1px solid var(--line);border-radius:7px;padding:0 9px;background:#fff}.toolbar .grow{flex:1;min-width:170px}
    .kpi-grid{display:grid;grid-template-columns:repeat(6,minmax(130px,1fr));gap:9px;margin-bottom:10px}.kpi{background:#fff;border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:9px;padding:10px;text-align:left;min-height:76px;box-shadow:var(--shadow)}.kpi:hover{transform:translateY(-1px)}.kpi.warning{border-left-color:var(--yellow)}.kpi.danger{border-left-color:var(--red)}.kpi.success{border-left-color:var(--green)}.kpi .num{display:block;font-size:24px;font-weight:800;line-height:1.15}.kpi .label{font-size:12px;color:var(--muted)}.grid-2{display:grid;grid-template-columns:1.35fr 1fr;gap:10px}.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);min-width:0}.card-head{min-height:42px;display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line)}.card-head h2{font-size:14px;margin:0}.card-head .meta{margin-left:auto;color:var(--muted);font-size:11px}.card-body{padding:11px}.compact-list{list-style:none;padding:0;margin:0}.compact-list li{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #edf1f5}.compact-list li:last-child{border-bottom:0}.compact-list .main{min-width:0;flex:1}.compact-list strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.compact-list small{color:var(--muted)}.progress{height:7px;background:#e9eef3;border-radius:9px;overflow:hidden}.progress span{display:block;height:100%;background:var(--green);border-radius:9px}

    .tabs{display:flex;gap:3px;border-bottom:1px solid var(--line);margin-bottom:10px}.tabs button{border:0;background:transparent;padding:9px 12px;color:var(--muted);border-bottom:2px solid transparent}.tabs button.active{color:var(--blue);font-weight:750;border-bottom-color:var(--blue)}.score-wrap{overflow:auto;max-height:calc(100vh - 250px);border:1px solid var(--line);border-radius:8px;background:#fff}.score-table th:first-child,.score-table td:first-child{position:sticky;left:0;z-index:4;background:#f5f9fd}.score-table th:first-child{z-index:6}.score-table input{width:72px;height:31px;border:1px solid #cbd8e5;border-radius:5px;text-align:center}.score-table input:focus{outline:2px solid #72b5f3;border-color:var(--blue)}.score-table input.missing{background:#fff5d8}.score-table input:disabled{background:#eef1f4;color:#6f7b87}.score-total{font-weight:800;color:var(--blue)}
    .kanban{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:10px;overflow:auto}.kanban-col{background:#edf2f7;border-radius:9px;padding:8px;min-height:240px}.kanban-col h3{font-size:12px;text-transform:uppercase;color:#526477;margin:2px 2px 8px}.task-card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:9px;margin-bottom:7px}.task-card strong{display:block;margin-bottom:5px}.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);border-left:1px solid var(--line);border-top:1px solid var(--line);background:#fff}.calendar-grid>div{min-height:94px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:5px}.calendar-grid .dow{min-height:auto;background:#edf4fb;text-align:center;font-weight:700}.calendar-grid .other{background:#f7f8fa;color:#9aa4af}.calendar-event{font-size:11px;background:var(--blue-soft);color:#0757a6;border-left:3px solid var(--blue);padding:3px 4px;margin-top:3px;border-radius:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

    .modal-layer{position:fixed;inset:0;background:rgba(9,22,36,.55);display:none;place-items:center;padding:20px;z-index:100}.modal-layer.open{display:grid}.modal{width:min(720px,100%);max-height:calc(100vh - 32px);overflow:auto;background:#fff;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.25)}.modal.wide{width:min(1050px,100%)}.modal-head,.modal-foot{display:flex;align-items:center;gap:8px;padding:12px 15px;border-bottom:1px solid var(--line)}.modal-head h2{font-size:17px;margin:0}.modal-head button{margin-left:auto}.modal-body{padding:14px}.modal-foot{border-top:1px solid var(--line);border-bottom:0;justify-content:flex-end;position:sticky;bottom:0;background:#fff}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.field{display:flex;flex-direction:column;gap:4px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:700;color:#3d5268}.field input,.field select,.field textarea{width:100%;border:1px solid #cbd7e3;border-radius:7px;padding:8px;background:#fff}.field textarea{min-height:78px;resize:vertical}.field .hint{font-size:11px;color:var(--muted)}.required::after{content:" *";color:var(--red)}.check-row{display:flex;align-items:center;gap:7px}.check-row input{width:auto}.error{color:var(--red);font-size:12px;margin-top:4px}.wizard-steps{display:flex;gap:4px;margin-bottom:14px}.wizard-steps span{height:5px;flex:1;background:#dce5ed;border-radius:4px}.wizard-steps span.done,.wizard-steps span.active{background:var(--blue)}
    .toast-zone{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:7px;z-index:200}.toast{min-width:260px;max-width:390px;background:#172235;color:#fff;border-radius:8px;padding:10px 12px;box-shadow:0 8px 25px rgba(0,0,0,.2)}.toast.ok{background:#146b4c}.toast.bad{background:#a93232}.notice{padding:9px 11px;border-radius:8px;background:#eef6ff;border:1px solid #cfe2f5;color:#244f76;margin-bottom:10px}.notice.warn{background:#fff8e6;border-color:#f4dfa1;color:#715500}.notice.danger{background:#fff0f0;border-color:#f1c2c2;color:#8f2f2f}.split{display:flex;align-items:center;justify-content:space-between;gap:8px}.mt{margin-top:10px}.muted{color:var(--muted)}.right{text-align:right}.center{text-align:center}.nowrap{white-space:nowrap}
    @media(max-width:1180px){.kpi-grid{grid-template-columns:repeat(3,1fr)}.status-line .sync-state{display:none}.context-select:nth-of-type(2){display:none}}@media(max-width:850px){:root{--sidebar:64px}.brand-text,.nav-label,.sidebar-foot{display:none}.nav button{justify-content:center}.grid-2,.grid-3,.assistant-layout{grid-template-columns:1fr}.topbar{padding:8px}.context-select{display:none}.searchbox{max-width:none}.status-line{display:none}.kpi-grid{grid-template-columns:repeat(2,1fr)}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.content{padding:10px}.kanban{grid-template-columns:repeat(4,260px)}}
    @media(max-width:520px){.app{grid-template-columns:1fr;grid-template-rows:var(--top) 1fr 54px}.sidebar{grid-row:3;grid-column:1;width:100%;height:54px}.brand,.sidebar-foot{display:none}.nav{display:flex;padding:4px;overflow-x:auto}.nav button{min-width:54px;width:54px;height:46px}.topbar,.content{grid-column:1}.topbar{grid-row:1}.content{grid-row:2}.topbar>.icon-btn{display:none}.kpi-grid{grid-template-columns:1fr 1fr}.kpi .num{font-size:20px}.page-head{align-items:center}.page-head p{display:none}.page-actions .btn:not(.primary){display:none}.calendar-grid>div{min-height:70px}.modal-layer{padding:5px}}
    @media print{body{overflow:visible;background:#fff}.sidebar,.topbar,.page-head,.toolbar,.tabs,.no-print,.toast-zone{display:none!important}.app{display:block}.content{overflow:visible;padding:0}.page{display:none!important}.page.active{display:block!important}.card,.table-wrap{box-shadow:none;border:0;max-height:none;overflow:visible}table{font-size:10pt}th{position:static;background:#eee!important;color:#000}@page{size:A4 landscape;margin:12mm}}
  </style>

<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><div class="brand-mark">Đ</div><div class="brand-text"><strong>TRỢ LÝ TỔNG PHỤ TRÁCH</strong><span>Công tác Đội THCS</span></div></div>
      <nav class="nav" id="nav" aria-label="Điều hướng chính"></nav>
      <div class="sidebar-foot">Dữ liệu lưu cục bộ trên thiết bị • Phiên bản 1.0</div>
    </aside>
    <header class="topbar">
      <button class="icon-btn" id="toggleSidebar" title="Thu gọn thanh bên" aria-label="Thu gọn thanh bên">☰</button>
      <select class="context-select" id="yearSelect" aria-label="Năm học"></select>
      <select class="context-select" id="semesterSelect" aria-label="Học kỳ"></select>
      <select class="context-select" id="weekSelect" aria-label="Tuần"></select>
      <select class="context-select" id="campusSelect" aria-label="Cơ sở"></select>
      <div class="searchbox"><label class="sr-only" for="globalSearch">Tìm kiếm</label><input id="globalSearch" placeholder="Tìm công việc, lớp, hoạt động…" autocomplete="off"></div>
      <button class="btn primary" id="quickAdd">＋ Thêm nhanh</button>
      <div class="status-line"><span class="save-state" id="saveState">Đã lưu</span><span class="dot" id="networkDot"></span><span id="networkText">Trực tuyến</span><span class="sync-state" id="syncState">Cục bộ • chưa cấu hình đồng bộ</span></div>
    </header>
    <main class="content" id="content" tabindex="-1"></main>
  </div>
  <div class="modal-layer" id="modalLayer" aria-hidden="true"><section class="modal" id="modal" role="dialog" aria-modal="true"><div class="modal-head"><h2 id="modalTitle"></h2><button class="icon-btn" id="modalClose" aria-label="Đóng">×</button></div><div class="modal-body" id="modalBody"></div><div class="modal-foot" id="modalFoot"></div></section></div>
  <div class="toast-zone" id="toasts" aria-live="polite"></div>
  <input type="file" id="fileInput" class="hidden" accept=".json,.tdt,.csv,text/csv,application/json">
  <script>
  'use strict';
  (()=>{
    const APP={name:'Trợ lý Tổng phụ trách Đội THCS',version:'1.0.0',schema:3,dbName:'TPT_DOI_THCS_DB'};
    const STORES=['profiles','schools','campuses','school_years','semesters','school_weeks','grades','classes','homeroom_teachers','plans','plan_targets','tasks','task_check_items','task_dependencies','calendar_events','activity_categories','activities','activity_classes','activity_check_items','criteria_sets','criteria_groups','criteria','weekly_score_sheets','score_entries','score_evidence','ranking_snapshots','team_units','team_positions','team_members','training_records','programs','program_results','commendations','documents','attachments','equipment','equipment_transactions','report_templates','generated_reports','audit_logs','app_settings','sync_outbox','sync_conflicts'];
    const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
    const uid=()=>crypto.randomUUID?crypto.randomUUID():`${Date.now()}-${Math.random().toString(16).slice(2)}`;
    const now=()=>new Date().toISOString();
    const localISO=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const today=()=>localISO(new Date());
    const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    const fmtDate=v=>v?new Intl.DateTimeFormat('vi-VN').format(new Date(v+'T00:00:00')):'—';
    const fmtDateTime=v=>v?new Intl.DateTimeFormat('vi-VN',{dateStyle:'short',timeStyle:'short'}).format(new Date(v)):'—';
    const clamp=(n,a,b)=>Math.min(b,Math.max(a,Number(n)||0));
    const csvSafe=v=>{let s=String(v??'').replace(/"/g,'""');if(/^[=+\-@]/.test(s))s="'"+s;return '"'+s+'"'};
    const statusLabel=s=>({todo:'Chưa làm',doing:'Đang làm',waiting:'Chờ phối hợp',review:'Chờ duyệt',done:'Hoàn thành',paused:'Tạm dừng',draft:'Bản nháp',complete:'Đã nhập đủ',approved:'Đã duyệt',locked:'Đã khóa',unlocked:'Đã mở khóa',planned:'Dự kiến',active:'Đang thực hiện',finished:'Đã kết thúc'}[s]||s||'—');
    const statusBadge=s=>`<span class="badge ${['done','approved','locked','finished'].includes(s)?'green':['overdue','urgent'].includes(s)?'red':['doing','review','active'].includes(s)?'blue':'yellow'}">${esc(statusLabel(s))}</span>`;
    const state={page:'dashboard',yearId:'',semesterId:'all',weekId:'',campusId:'all',scoreTab:'entry',taskView:'list',calendarDate:new Date(),lastScoreUndo:null,cache:{}};

    class LocalDataProvider{
      constructor(){this.db=null}
      open(){return new Promise((resolve,reject)=>{const req=indexedDB.open(APP.dbName,APP.schema);req.onupgradeneeded=e=>{const db=e.target.result;for(const name of STORES){if(!db.objectStoreNames.contains(name)){const s=db.createObjectStore(name,{keyPath:'id'});s.createIndex('updated_at','updated_at',{unique:false});if(['classes','plans','tasks','calendar_events','activities','criteria_sets','weekly_score_sheets','score_entries'].includes(name)){s.createIndex('school_year_id','school_year_id',{unique:false});s.createIndex('campus_id','campus_id',{unique:false})}}}};req.onsuccess=()=>{this.db=req.result;resolve(this)};req.onerror=()=>reject(req.error)})}
      tx(store,mode='readonly'){return this.db.transaction(store,mode).objectStore(store)}
      all(store){return new Promise((res,rej)=>{const r=this.tx(store).getAll();r.onsuccess=()=>res(r.result.filter(x=>!x.deleted_at));r.onerror=()=>rej(r.error)})}
      get(store,id){return new Promise((res,rej)=>{const r=this.tx(store).get(id);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
      put(store,row,{audit=true}={}){const rec={...row,id:row.id||uid(),created_at:row.created_at||now(),updated_at:now(),revision:(row.revision||0)+1,sync_status:'local'};return new Promise((res,rej)=>{setSave('Đang lưu…');const r=this.tx(store,'readwrite').put(rec);r.onsuccess=async()=>{setSave('Đã lưu');if(audit&&store!=='audit_logs')await this.put('audit_logs',{action:row.id?'update':'create',entity:store,entity_id:rec.id,summary:rec.name||rec.title||rec.code||rec.class_name||''},{audit:false});res(rec)};r.onerror=()=>{setSave('Lỗi lưu');rej(r.error)}})}
      bulkPut(store,rows){return new Promise((res,rej)=>{const tx=this.db.transaction(store,'readwrite'),os=tx.objectStore(store);rows.forEach(row=>os.put({...row,id:row.id||uid(),created_at:row.created_at||now(),updated_at:now(),revision:(row.revision||0)+1,sync_status:'local'}));tx.oncomplete=()=>res(rows.length);tx.onerror=()=>rej(tx.error)})}
      remove(store,id){return this.get(store,id).then(r=>r?this.put(store,{...r,deleted_at:now()}):null)}
      hardClear(store){return new Promise((res,rej)=>{const r=this.tx(store,'readwrite').clear();r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
      async exportAll(){const data={};for(const s of STORES)data[s]=await new Promise((res,rej)=>{const r=this.tx(s).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});return {app:APP.name,version:APP.version,schema:APP.schema,exported_at:now(),data}}

    async function scorePaste(e){const text=e.clipboardData?.getData('text/plain');if(!text||(!text.includes('\t')&&!text.includes('\n')))return;e.preventDefault();const ctx=await scoreContext(),matrix=text.trim().split(/\r?\n/).map(r=>r.split('\t')),startR=Number(e.currentTarget.dataset.row),startC=Number(e.currentTarget.dataset.col),map=entryMap(ctx.entries),batch=[];for(let r=0;r<matrix.length;r++)for(let c=0;c<matrix[r].length;c++){const cl=ctx.classes[startR+r],criterion=ctx.criteria[startC+c];if(!cl||!criterion)continue;const raw=matrix[r][c].trim().toUpperCase(),old=map.get(cl.id+'|'+criterion.id);let entry_state='value',value=null;if(raw==='KAD'||raw==='N/A')entry_state='na';else if(raw==='MIỄN'||raw==='MIEN')entry_state='exempt';else{value=Number(raw.replace(',','.'));if(!Number.isFinite(value)||value<Number(criterion.min??-Infinity)||value>Number(criterion.max??Infinity))continue}batch.push({...(old||{}),id:old?.id||uid(),sheet_id:ctx.sheet.id,school_year_id:state.yearId,campus_id:cl.campus_id,class_id:cl.id,criteria_id:criterion.id,week_id:state.weekId,entry_state,value})}if(batch.length){await db.bulkPut('score_entries',batch);await db.put('audit_logs',{action:'score_bulk_paste',entity:'score_entries',summary:`Dán ${batch.length} ô điểm`,reason:'Dán vùng dữ liệu từ bảng tính'});toast(`Đã dán ${batch.length} ô dữ liệu`);renderScores()}else toast('Không có ô hợp lệ để nhập.','bad')}

    function unlockSheet(sheet){openModal('Mở khóa bảng thi đua',`<div class="notice danger">Mở khóa cho phép sửa điểm đã khóa. Hệ thống sẽ ghi lại lý do, thời gian và đánh dấu báo cáo liên quan cần cập nhật.</div><div class="field"><label class="required">Lý do mở khóa</label><textarea id="unlockReason" maxlength="500" required></textarea></div>`,`<button class="btn" id="cancelUnlock">Hủy</button><button class="btn danger" id="confirmUnlock">Mở khóa</button>`);$('#cancelUnlock').onclick=closeModal;$('#confirmUnlock').onclick=async()=>{const reason=$('#unlockReason').value.trim();if(reason.length<5)return toast('Hãy nhập lý do cụ thể, tối thiểu 5 ký tự.','bad');await db.put('weekly_score_sheets',{...sheet,status:'unlocked',unlock_reason:reason,unlocked_at:now(),reports_stale:true});await db.put('audit_logs',{action:'sheet_unlock',entity:'weekly_score_sheets',entity_id:sheet.id,summary:'Mở khóa bảng thi đua',reason});closeModal();toast('Đã mở khóa và lưu lý do');renderScores()}}
    async function calculateRanking(official=true){const ctx=await scoreContext();if(!ctx.sheet||(official&&!['approved','locked'].includes(ctx.sheet.status)))return[];const map=entryMap(ctx.entries);return ctx.classes.map(cl=>{let total=ctx.set?.formula==='base'?Number(ctx.set.base_score||0):0,filled=0;ctx.criteria.forEach(c=>{const e=map.get(cl.id+'|'+c.id);if(e){filled++;if(e.entry_state==='value')total+=Number(e.value||0)}});return{id:cl.id,class_name:cl.class_name,campus_id:cl.campus_id,total,filled,complete:filled===ctx.criteria.length}}).filter(x=>x.filled>0).sort((a,b)=>b.total-a.total||a.class_name.localeCompare(b.class_name,'vi',{numeric:true}))}
    async function renderScoreRanking(ctx){const area=$('#scoreArea'),official=['approved','locked'].includes(ctx.sheet?.status),rank=await calculateRanking(false);area.innerHTML=`${!official?'<div class="notice warn">Bảng chưa được duyệt. Xếp hạng dưới đây là tạm thời, không dùng cho báo cáo chính thức.</div>':''}<div class="table-wrap"><table><thead><tr><th>Hạng</th><th>Lớp</th><th>Cơ sở</th><th>Tổng điểm</th><th>Mức dữ liệu</th><th>Loại</th></tr></thead><tbody>${rank.map((r,i)=>`<tr><td><strong>${i+1}</strong></td><td>${esc(r.class_name)}</td><td>${esc(campusName(r.campus_id))}</td><td><strong>${r.total.toFixed(1)}</strong></td><td>${r.complete?'<span class="badge green">Đủ</span>':'<span class="badge yellow">Chưa đủ</span>'}</td><td>${official?'<span class="badge green">Chính thức</span>':'<span class="badge yellow">Tạm thời</span>'}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">Chưa có dữ liệu xếp hạng.</td></tr>'}</tbody></table></div>`}
    function renderScoreAnomalies(ctx){const map=entryMap(ctx.entries),items=[];ctx.classes.forEach(cl=>{const count=ctx.criteria.filter(c=>map.has(cl.id+'|'+c.id)).length;if(!count)items.push({level:'red',text:`Lớp ${cl.class_name} chưa có dữ liệu.`});else if(count<ctx.criteria.length)items.push({level:'yellow',text:`Lớp ${cl.class_name} còn thiếu ${ctx.criteria.length-count} tiêu chí.`})});ctx.entries.forEach(e=>{const c=ctx.criteria.find(x=>x.id===e.criteria_id);if(c?.evidence_required&&!e.evidence_id)items.push({level:'yellow',text:`Thiếu minh chứng bắt buộc tại lớp ${ctx.classes.find(x=>x.id===e.class_id)?.class_name}, tiêu chí ${c.code}.`});if(e.entry_state==='value'&&(e.value<c?.min||e.value>c?.max))items.push({level:'red',text:`Giá trị vượt giới hạn ở tiêu chí ${c?.code}.`})});$('#scoreArea').innerHTML=`<div class="notice">Cảnh báo chỉ yêu cầu kiểm tra, không tự kết luận sai phạm.</div><div class="card"><div class="card-body"><ul class="compact-list">${items.map(x=>`<li><span class="badge ${x.level}">${x.level==='red'?'Kiểm tra':'Lưu ý'}</span><div class="main">${esc(x.text)}</div></li>`).join('')||'<li class="muted">Chưa phát hiện bất thường theo các quy tắc đang bật.</li>'}</ul></div></div>`}
    async function renderScoreHistory(ctx){const logs=(await db.all('audit_logs')).filter(x=>['score_entries','weekly_score_sheets'].includes(x.entity)).sort((a,b)=>b.created_at.localeCompare(a.created_at));$('#scoreArea').innerHTML=`<div class="table-wrap"><table><thead><tr><th>Thời gian</th><th>Hành động</th><th>Nội dung</th><th>Giá trị cũ</th><th>Giá trị mới</th><th>Lý do</th></tr></thead><tbody>${logs.map(x=>`<tr><td>${fmtDateTime(x.created_at)}</td><td>${esc(x.action)}</td><td>${esc(x.summary)}</td><td>${esc(x.old_value??'—')}</td><td>${esc(x.new_value??'—')}</td><td class="wrap">${esc(x.reason||'—')}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">Chưa có điều chỉnh.</td></tr>'}</tbody></table></div>`}
    async function showCriteriaConfig(){const sets=await scoped('criteria_sets'),set=sets[0],criteria=set?(await db.all('criteria')).filter(x=>x.criteria_set_id===set.id):[];openModal('Bộ tiêu chí thi đua',`<div class="notice warn">Bộ tiêu chí là quy định nội bộ. Chỉ đưa vào áp dụng sau khi nhà trường phê duyệt và ghi rõ căn cứ.</div><form id="criteriaSetForm"><div class="form-grid"><div class="field full"><label class="required">Tên bộ tiêu chí</label><input name="name" value="${esc(set?.name||'')}"></div><div class="field"><label>Phiên bản</label><input name="version" value="${esc(set?.version||'1.0')}"></div><div class="field"><label>Cách tính</label><select name="formula"><option value="base" ${set?.formula==='base'?'selected':''}>Điểm chuẩn rồi cộng/trừ</option><option value="sum" ${set?.formula==='sum'?'selected':''}>Cộng điểm từng nhóm</option></select></div><div class="field"><label>Điểm chuẩn</label><input type="number" name="base_score" value="${set?.base_score||100}"></div><div class="field"><label>Trạng thái</label><select name="status"><option value="draft" ${set?.status==='draft'?'selected':''}>Dự thảo</option><option value="active" ${set?.status==='active'?'selected':''}>Đang áp dụng</option><option value="stopped" ${set?.status==='stopped'?'selected':''}>Ngừng áp dụng</option></select></div><div class="field full"><label>Căn cứ nội bộ</label><textarea name="basis">${esc(set?.basis||'')}</textarea></div></div></form><h3>Tiêu chí</h3><div class="table-wrap" style="max-height:250px"><table><thead><tr><th>Mã</th><th>Nhóm</th><th>Tên</th><th>Điểm/lần</th><th>Giới hạn</th><th></th></tr></thead><tbody>${criteria.map(c=>`<tr><td>${esc(c.code)}</td><td>${esc(c.group)}</td><td class="wrap">${esc(c.name)}</td><td>${c.points}</td><td>${c.min} → ${c.max}</td><td><button class="link-btn red" data-remove-criterion="${c.id}">Xóa</button></td></tr>`).join('')}</tbody></table></div><div class="form-grid mt" id="newCriterion"><div class="field"><label>Mã</label><input id="cCode"></div><div class="field"><label>Nhóm</label><input id="cGroup"></div><div class="field full"><label>Tên tiêu chí</label><input id="cName"></div><div class="field"><label>Điểm/lần</label><input id="cPoints" type="number" value="0"></div><div class="field"><label>Giới hạn (min;max)</label><input id="cRange" value="-20;20"></div></div><button class="btn small mt" id="addCriterion">＋ Thêm tiêu chí</button>`,`<button class="btn" id="closeCriteria">Đóng</button><button class="btn primary" id="saveCriteriaSet">Lưu bộ tiêu chí</button>`,true);$('#closeCriteria').onclick=closeModal;$('#saveCriteriaSet').onclick=async()=>{const d=Object.fromEntries(new FormData($('#criteriaSetForm')));d.base_score=Number(d.base_score||0);await db.put('criteria_sets',{...(set||{}),...d,school_year_id:state.yearId,campus_id:'all'});closeModal();toast('Đã lưu bộ tiêu chí');renderScores()};$('#addCriterion').onclick=async()=>{if(!set)return toast('Hãy lưu bộ tiêu chí trước khi thêm tiêu chí.','bad');const [min,max]=$('#cRange').value.split(';').map(Number);if(!$('#cCode').value.trim()||!$('#cName').value.trim()||!Number.isFinite(min)||!Number.isFinite(max))return toast('Kiểm tra mã, tên và giới hạn min;max.','bad');await db.put('criteria',{criteria_set_id:set.id,school_year_id:state.yearId,campus_id:'all',code:$('#cCode').value.trim(),group:$('#cGroup').value.trim(),name:$('#cName').value.trim(),points:Number($('#cPoints').value||0),min,max,data_type:'score',active:true,order:criteria.length+1});closeModal();showCriteriaConfig()};$$('[data-remove-criterion]').forEach(b=>b.onclick=async()=>{const used=(await db.all('score_entries')).some(x=>x.criteria_id===b.dataset.removeCriterion);if(used)return toast('Tiêu chí đã có dữ liệu lịch sử; chỉ nên ngừng áp dụng, không xóa.','bad');await db.remove('criteria',b.dataset.removeCriterion);closeModal();showCriteriaConfig()})}

    async function reportData(){const [school]=await db.all('schools'),tasks=await scoped('tasks'),events=await scoped('calendar_events'),activities=await scoped('activities'),rank=await calculateRanking(true),classes=await scoped('classes'),ctx=await scoreContext(),week=state.cache.weeks.find(x=>x.id===state.weekId);return{school,tasks,events,activities,rank,classes,ctx,week,completed:tasks.filter(x=>x.status==='done'),overdue:tasks.filter(x=>x.status!=='done'&&x.due_date<today()),upcoming:events.filter(x=>x.date>=today()).slice(0,10)}}
    async function renderReports(){const d=await reportData();setContent(pageHead('Báo cáo','Tổng hợp số liệu đã xác nhận và truy ngược về bản ghi gốc.',`<button class="btn" id="exportReportCsv">Xuất CSV</button><button class="btn" onclick="window.print()">In/Lưu PDF</button><button class="btn primary" id="saveReport">Lưu phiên bản</button>`)+`<div class="toolbar no-print"><select id="reportType"><option value="week">Báo cáo công tác tuần</option><option value="scores">Tổng hợp thi đua lớp</option><option value="tasks">Tiến độ công việc</option><option value="activities">Báo cáo hoạt động</option><option value="equipment">Báo cáo thiết bị</option></select><select id="reportPaper"><option>A4 ngang</option><option>A4 dọc</option></select><span class="muted">Số liệu nguồn không sửa tại báo cáo</span></div><article class="card" id="reportPreview"><div class="card-body">${await reportHTML('week',d)}</div></article>`);$('#reportType').onchange=async()=>$('#reportPreview .card-body').innerHTML=await reportHTML($('#reportType').value,await reportData());$('#exportReportCsv').onclick=()=>exportReportCSV($('#reportType').value,d);$('#saveReport').onclick=async()=>{const html=$('#reportPreview').innerText;await db.put('generated_reports',{name:`${$('#reportType option:checked').textContent} - ${fmtDate(today())}`,type:$('#reportType').value,scope:{year_id:state.yearId,week_id:state.weekId,campus_id:state.campusId},content:html,generated_at:now(),school_year_id:state.yearId,campus_id:state.campusId});toast('Đã lưu phiên bản báo cáo')}}
    async function reportHTML(type,d){const title={week:'BÁO CÁO CÔNG TÁC TUẦN',scores:'TỔNG HỢP THI ĐUA LỚP',tasks:'BÁO CÁO TIẾN ĐỘ CÔNG VIỆC',activities:'BÁO CÁO HOẠT ĐỘNG ĐỘI',equipment:'BÁO CÁO THIẾT BỊ ĐỘI'}[type];let body='';if(type==='week')body=`<h3>I. Kết quả thực hiện</h3><p>Đã hoàn thành <strong>${d.completed.length}</strong>/${d.tasks.length} công việc; còn <strong>${d.overdue.length}</strong> việc quá hạn.</p>${simpleTable(['Công việc','Trạng thái','Hạn'],d.tasks.map(x=>[x.title,statusLabel(x.status),fmtDate(x.due_date)]))}<h3>II. Hoạt động và lịch sắp tới</h3>${simpleTable(['Hoạt động','Thời gian','Địa điểm'],d.upcoming.map(x=>[x.title,fmtDate(x.date),x.location||'Chưa cập nhật']))}<h3>III. Kế hoạch tuần sau</h3><p class="muted">Phần nhận xét/kế hoạch có thể bổ sung khi in; hệ thống không tự tạo số liệu ngoài dữ liệu nguồn.</p>`;if(type==='scores')body=!['approved','locked'].includes(d.ctx.sheet?.status)?'<div class="notice warn">Bảng tuần chưa được duyệt nên chưa có xếp hạng chính thức.</div>':simpleTable(['Hạng','Lớp','Cơ sở','Tổng điểm'],d.rank.map((x,i)=>[i+1,x.class_name,campusName(x.campus_id),x.total.toFixed(1)]));if(type==='tasks')body=simpleTable(['Công việc','Nhóm','Cơ sở','Hạn','Trạng thái','Tiến độ'],d.tasks.map(x=>[x.title,x.group||'',campusName(x.campus_id),fmtDate(x.due_date),statusLabel(x.status),(x.progress||0)+'%']));if(type==='activities')body=simpleTable(['Hoạt động','Nhóm','Ngày','Địa điểm','Trạng thái'],d.activities.map(x=>[x.name,x.category,fmtDate(x.date),x.location,statusLabel(x.status)]));if(type==='equipment'){const eq=await scoped('equipment');body=simpleTable(['Mã','Thiết bị','Số lượng','Tình trạng','Nơi lưu'],eq.map(x=>[x.code,x.name,`${x.quantity} ${x.unit||''}`,x.condition,x.location]))}return `<div class="center"><small>${esc(d.school?.name||'TRƯỜNG THCS')}</small><h2 style="margin:8px 0">${title}</h2><p>${esc(d.week?.name||'')} • ${esc(campusName(state.campusId))}</p></div><div class="split"><small>Tạo lúc: ${fmtDateTime(now())}</small><small>Phạm vi dữ liệu: ${esc(d.week?.name||'Năm học')} / ${esc(campusName(state.campusId))}</small></div><hr style="border:0;border-top:1px solid var(--line)">${body}<div style="display:grid;grid-template-columns:1fr 1fr;text-align:center;margin-top:35px"><div><strong>Người lập báo cáo</strong></div><div><strong>Xác nhận của nhà trường</strong></div></div>`}
    function simpleTable(head,rows){return `<div class="table-wrap" style="max-height:none"><table><thead><tr>${head.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((x,i)=>`<td class="${i===0?'wrap':''}">${esc(x)}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${head.length}" class="empty">Không có dữ liệu trong phạm vi đã chọn.</td></tr>`}</tbody></table></div>`}
    function exportReportCSV(type,d){let head=[],rows=[];if(type==='scores'){head=['Hạng','Lớp','Cơ sở','Tổng điểm'];rows=d.rank.map((x,i)=>[i+1,x.class_name,campusName(x.campus_id),x.total])}else{head=['Công việc','Nhóm','Cơ sở','Hạn','Trạng thái','Tiến độ'];rows=d.tasks.map(x=>[x.title,x.group,campusName(x.campus_id),x.due_date,statusLabel(x.status),x.progress])}download('\ufeff'+[head,...rows].map(r=>r.map(csvSafe).join(',')).join('\r\n'),`bao-cao-${type}-${today()}.csv`,'text/csv;charset=utf-8')}

    async function renderAssistant(){setContent(pageHead('Trợ lý tổng hợp','Trả lời theo quy tắc từ dữ liệu đã lưu; không tự sửa hoặc tạo số liệu.',`<span class="badge blue">AssistantProvider cục bộ</span>`)+`<div class="assistant-layout"><aside class="card quick-prompts"><div class="card-head"><h2>Câu hỏi nhanh</h2></div><div class="card-body">${['Hôm nay tôi cần làm gì?','Việc nào đang quá hạn?','Lớp nào chưa nhập thi đua?','Tuần này có bất thường gì?','Tạo nháp báo cáo tuần.','Tóm tắt tiến độ tháng.','Hoạt động sắp tới còn thiếu gì?','Dữ liệu nào chưa được sao lưu?'].map(x=>`<button data-prompt="${esc(x)}">${esc(x)}</button>`).join('')}</div></aside><section class="card assistant-answer"><div class="card-head"><h2>Tra cứu dữ liệu</h2></div><div class="card-body"><div class="split"><input id="assistantQuery" style="flex:1;height:38px;border:1px solid var(--line);border-radius:7px;padding:0 9px" placeholder="Nhập câu hỏi về dữ liệu hệ thống…"><button class="btn primary" id="askAssistant">Tra cứu</button></div><div id="assistantOutput" class="mt"><div class="notice">Chọn một câu hỏi nhanh hoặc nhập câu hỏi. Phản hồi luôn ghi rõ thời điểm và phạm vi.</div></div></div></section></div>`);const ask=async q=>{$('#assistantQuery').value=q;$('#assistantOutput').innerHTML='<div class="empty">Đang tổng hợp dữ liệu…</div>';$('#assistantOutput').innerHTML=await assistant.answer(q)};$$('[data-prompt]').forEach(b=>b.onclick=()=>ask(b.dataset.prompt));$('#askAssistant').onclick=()=>ask($('#assistantQuery').value);$('#assistantQuery').onkeydown=e=>{if(e.key==='Enter')$('#askAssistant').click()}}
    async function buildAssistantAnswer(q){q=(q||'').trim().toLowerCase();const d=await reportData(),filled=new Set(d.ctx.entries.map(x=>x.class_id)),missing=d.classes.filter(x=>!filled.has(x.id)),stamp=`Dữ liệu lúc ${fmtDateTime(now())}; phạm vi ${d.week?.name||'năm học'}, ${campusName(state.campusId)}.`;let title='Kết quả tra cứu',html='';if(!q)return'<div class="notice warn">Hãy nhập câu hỏi cụ thể.</div>';if(q.includes('hôm nay')){const list=d.tasks.filter(x=>x.status!=='done'&&(x.due_date<=today()||x.start_date===today()));title='Việc cần làm hôm nay';html=list.length?`<ul>${list.map(x=>`<li>${esc(x.title)} — hạn ${fmtDate(x.due_date)}</li>`).join('')}</ul>`:'Không có công việc đến hạn hôm nay.'}else if(q.includes('quá hạn')){title='Công việc quá hạn';html=d.overdue.length?`<ul>${d.overdue.map(x=>`<li>${esc(x.title)} — quá hạn từ ${fmtDate(x.due_date)}</li>`).join('')}</ul>`:'Không có công việc quá hạn.'}else if(q.includes('chưa nhập')){title='Lớp chưa nhập thi đua';html=missing.length?missing.map(x=>`<span class="badge yellow" style="margin:3px">${esc(x.class_name)}</span>`).join(''):'Không có lớp chưa nhập trong bảng hiện tại.'}else if(q.includes('bất thường')){title='Dấu hiệu cần kiểm tra';html=`Có ${missing.length} lớp chưa có dữ liệu; ${d.ctx.entries.filter(x=>{const c=d.ctx.criteria.find(y=>y.id===x.criteria_id);return x.entry_state==='value'&&(x.value<c?.min||x.value>c?.max)}).length} giá trị vượt giới hạn cấu hình. Cảnh báo không phải kết luận sai phạm.`}else if(q.includes('báo cáo')){title='Nháp báo cáo tuần';html=`Trong phạm vi đã chọn có ${d.tasks.length} công việc, ${d.completed.length} việc hoàn thành và ${d.overdue.length} việc quá hạn. Có ${d.upcoming.length} hoạt động/lịch sắp tới. ${['approved','locked'].includes(d.ctx.sheet?.status)?`Bảng thi đua đã được duyệt; lớp dẫn đầu là ${esc(d.rank[0]?.class_name||'chưa xác định')}.`:'Bảng thi đua chưa được duyệt nên không đưa xếp hạng vào báo cáo chính thức.'}<br><button class="btn small mt" data-assis     function chooseBackup(){openModal('Tạo bản sao lưu',`<div class="field"><label>Chế độ</label><select id="backupMode"><option value="plain">JSON thường</option><option value="encrypted">Mã hóa AES-GCM bằng mật khẩu</option></select></div><div class="field mt" id="backupPasswordField" style="display:none"><label>Mật khẩu (tối thiểu 8 ký tự)</label><input id="backupPassword" type="password" autocomplete="new-password"></div><div class="notice warn mt">Nếu quên mật khẩu, không thể phục hồi tệp mã hóa.</div>`,`<button class="btn" id="cancelBackup">Hủy</button><button class="btn primary" id="doBackup">Tạo tệp</button>`);$('#cancelBackup').onclick=closeModal;$('#backupMode').onchange=()=>$('#backupPasswordField').style.display=$('#backupMode').value==='encrypted'?'flex':'none';$('#doBackup').onclick=async()=>{try{const payload=await db.exportAll();let text=JSON.stringify(payload),name=`tro-ly-doi-backup-${today()}.json`;if($('#backupMode').value==='encrypted'){const p=$('#backupPassword').value;if(p.length<8)return toast('Mật khẩu cần ít nhất 8 ký tự.','bad');text=JSON.stringify(await encryptText(text,p));name=`tro-ly-doi-backup-${today()}.tdt`}download(text,name,'application/json');await setting('last_backup_at',now());closeModal();toast('Đã tạo bản sao lưu')}catch(e){toast('Không thể tạo sao lưu: '+e.message,'bad')}}}
    async function encryptText(text,password){const enc=new TextEncoder(),salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),base=await crypto.subtle.importKey('raw',enc.encode(password),'PBKDF2',false,['deriveKey']),key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:210000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt']),data=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,enc.encode(text));return{format:'TPT-ENCRYPTED-1',kdf:'PBKDF2-SHA256',iterations:210000,cipher:'AES-GCM',salt:b64(salt),iv:b64(iv),data:b64(new Uint8Array(data))}}
    async function decryptText(obj,password){const enc=new TextEncoder(),base=await crypto.subtle.importKey('raw',enc.encode(password),'PBKDF2',false,['deriveKey']),key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:unb64(obj.salt),iterations:obj.iterations,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']),data=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(obj.iv)},key,unb64(obj.data));return new TextDecoder().decode(data)}
    const b64=u=>btoa(String.fromCharCode(...u)),unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));

    function yearForm(){openModal('Thêm năm học',`<form id="yearForm"><div class="form-grid"><div class="field full"><label class="required">Tên năm học</label><input name="name" placeholder="2027–2028" required></div><div class="field"><label class="required">Ngày bắt đầu</label><input type="date" name="start_date" required></div><div class="field"><label class="required">Ngày kết thúc</label><input type="date" name="end_date" required></div><label class="check-row full"><input type="checkbox" name="is_current" value="true"> Đặt làm năm học hiện hành</label></div></form>`,`<button class="btn" id="cancelYear">Hủy</button><button class="btn primary" id="saveYear">Tạo năm học và 40 tuần</button>`);$('#cancelYear').onclick=closeModal;$('#saveYear').onclick=async()=>{const f=$('#yearForm');if(!f.reportValidity())return;const d=Object.fromEntries(new FormData(f));if(d.end_date<=d.start_date)return toast('Ngày kết thúc phải sau ngày bắt đầu.','bad');const id=uid();if(d.is_current){for(const y of await db.all('school_years'))await db.put('school_years',{...y,is_current:false})}await db.put('school_years',{id,...d,is_current:!!d.is_current});const weeks=[];let date=new Date(d.start_date+'T00:00:00');for(let i=1;i<=40;i++){let end=new Date(date);end.setDate(end.getDate()+6);weeks.push({id:uid(),school_year_id:id,number:i,name:`Tuần ${i}`,start_date:localISO(date),end_date:localISO(end)});date.setDate(date.getDate()+7)}await db.bulkPut('school_weeks',weeks);closeModal();await loadContext();toast('Đã tạo năm học');renderSettings()}}
    async function classForm(id){const c=id?await db.get('classes',id):{active:true,campus_id:state.cache.campuses[0]?.id};openModal(id?'Sửa lớp':'Thêm lớp',`<form id="classForm"><div class="form-grid"><div class="field"><label class="required">Tên lớp/chi đội</label><input name="class_name" value="${esc(c.class_name||'')}" required></div><div class="field"><label class="required">Khối</label><select name="grade">${[6,7,8,9].map(g=>`<option value="${g}" ${Number(c.grade)===g?'selected':''}>Khối ${g}</option>`).join('')}</select></div><div class="field"><label class="required">Cơ sở</label><select name="campus_id">${state.cache.campuses.map(x=>`<option value="${x.id}" ${c.campus_id===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>Giáo viên chủ nhiệm</label><input name="teacher" value="${esc(c.teacher||'')}"></div><label class="check-row"><input type="checkbox" name="active" value="true" ${c.active!==false?'checked':''}> Đang hoạt động</label></div></form>`,`<button class="btn" id="cancelClass">Hủy</button><button class="btn primary" id="saveClass">Lưu lớp</button>`);$('#cancelClass').onclick=closeModal;$('#saveClass').onclick=async()=>{const f=$('#classForm');if(!f.reportValidity())return;const d=Object.fromEntries(new FormData(f)),dupe=(await db.all('classes')).some(x=>x.id!==id&&x.school_year_id===state.yearId&&x.class_name.toLowerCase()===d.class_name.toLowerCase());if(dupe)return toast('Tên lớp đã tồn tại trong năm học.','bad');await db.put('classes',{...c,...d,grade:Number(d.grade),active:!!d.active,school_year_id:state.yearId});closeModal();toast('Đã lưu lớp');renderSettings()}}
    function showClassImport(){openModal('Nhập danh sách lớp',`<div class="notice">Dán dữ liệu từ Excel theo 5 cột: mã lớp, tên lớp, khối, mã cơ sở, giáo viên chủ nhiệm. Dòng tiêu đề có thể có hoặc không.</div><div class="field"><label>Dữ liệu CSV hoặc bảng dán</label><textarea id="classImportText" style="min-height:220px" placeholder="6A1\t6/1\t6\tCS1\tNguyễn Văn A"></textarea></div><div id="importPreview" class="mt"></div>`,`<button class="btn" id="cancelImport">Hủy</button><button class="btn" id="previewImport">Xem trước</button><button class="btn primary" id="commitImport" disabled>Nhập dữ liệu</button>`,true);$('#cancelImport').onclick=closeModal;let parsed=[];$('#previewImport').onclick=()=>{const text=$('#classImportText').value.trim();if(!text)return toast('Hãy dán dữ liệu.','bad');const delim=text.includes('\t')?'\t':',',rows=text.split(/\r?\n/).map(line=>parseDelimited(line,delim)).filter(r=>r.length>=4);if(rows[0]&&/mã|ma_lop/i.test(rows[0][0]))rows.shift();parsed=rows.map((r,i)=>({row:i+1,code:r[0]?.trim(),class_name:r[1]?.trim(),grade:Number(r[2]),campus_code:r[3]?.trim(),teacher:r[4]?.trim()||''}));const errors=parsed.filter(x=>!x.class_name||![6,7,8,9].includes(x.grade)||!state.cache.campuses.some(c=>c.code===x.campus_code));$('#importPreview').innerHTML=`<div class="notice ${errors.length?'danger':''}">${parsed.length} dòng; ${errors.length} dòng lỗi.</div>${simpleTable(['Dòng','Lớp','Khối','Cơ sở','Kết quả'],parsed.slice(0,20).map(x=>[x.row,x.class_name,x.grade,x.campus_code,!x.class_name||![6,7,8,9].includes(x.grade)||!state.cache.campuses.some(c=>c.code===x.campus_code)?'Lỗi':'Hợp lệ']))}`;$('#commitImport').disabled=!!errors.length||!parsed.length};$('#commitImport').onclick=async()=>{const existing=await db.all('classes'),fresh=parsed.filter(x=>!existing.some(e=>e.school_year_id===state.yearId&&e.class_name.toLowerCase()===x.class_name.toLowerCase())).map(x=>({id:uid(),school_year_id:state.yearId,campus_id:state.cache.campuses.find(c=>c.code===x.campus_code).id,code:x.code,class_name:x.class_name,grade:x.grade,teacher:x.teacher,active:true}));await db.bulkPut('classes',fresh);await db.put('audit_logs',{action:'bulk_import',entity:'classes',summary:`Nhập ${fresh.length} lớp`,reason:'Nhập CSV/Excel'});closeModal();toast(`Đã nhập ${fresh.length} lớp; bỏ qua ${parsed.length-fresh.length} lớp trùng.`);renderSettings()}}
    function parseDelimited(line,delim){if(delim==='\t')return line.split('\t');const out=[];let cur='',q=false;for(let i=0;i<line.length;i++){const c=line[i];if(c==='"'){if(q&&line[i+1]==='"'){cur+='"';i++}else q=!q}else if(c===','&&!q){out.push(cur);cur=''}else cur+=c}out.push(cur);return out}
    async function deleteSampleData(){openModal('Xóa dữ liệu mẫu',`<div class="notice danger">Chỉ các bản ghi mang nhãn dữ liệu mẫu bị xóa. Dữ liệu thầy đã tạo được giữ nguyên.</div>`,`<button class="btn" id="cancelSample">Hủy</button><button class="btn danger" id="confirmSample">Xóa dữ liệu mẫu</button>`);$('#cancelSample').onclick=closeModal;$('#confirmSample').onclick=async()=>{let n=0;for(const s of STORES){for(const r of await db.all(s))if(r.is_sample){await db.remove(s,r.id);n++}}await setting('sample_deleted',true);closeModal();toast(`Đã xóa ${n} bản ghi mẫu`);await loadContext();renderSettings()}}
    function wipeLocalData(){openModal('Xóa toàn bộ dữ liệu cục bộ',`<div class="notice danger"><strong>Không thể hoàn tác nếu chưa sao lưu.</strong></div><div class="field"><label>Nhập chính xác: XÓA TOÀN BỘ</label><input id="wipeConfirm" autocomplete="off"></div>`,`<button class="btn" id="cancelWipe">Hủy</button><button class="btn danger" id="confirmWipe">Xóa vĩnh viễn trên thiết bị</button>`);$('#cancelWipe').onclick=closeModal;$('#confirmWipe').onclick=async()=>{if($('#wipeConfirm').value!=='XÓA TOÀN BỘ')return toast('Câu xác nhận chưa chính xác.','bad');download(JSON.stringify(await db.exportAll()),`truoc-khi-xoa-${today()}.json`,'application/json');for(const s of STORES)await db.hardClear(s);closeModal();location.reload()}}

    async function globalSearch(){const q=$('#globalSearch').value.trim().toLowerCase();if(q.length<2)return;const groups=[];for(const [store,label,page,field] of [['tasks','Công việc','tasks','title'],['classes','Lớp','settings','class_name'],['activities','Hoạt động','activities','name'],['plans','Kế hoạch','plans','name'],['documents','Hồ sơ','documents','name']]){const rows=(await scoped(store)).filter(x=>JSON.stringify(x).toLowerCase().includes(q)).slice(0,5);groups.push(...rows.map(r=>({label,page,text:r[field],sub:store==='classes'?campusName(r.campus_id):r.group||r.type||''})))}openModal('Kết quả tìm kiếm',groups.length?`<ul class="compact-list">${groups.map(x=>`<li><div class="main"><strong>${esc(x.text)}</strong><small>${esc(x.label)} • ${esc(x.sub)}</small></div><button class="link-btn" data-search-go="${x.page}">Mở</button></li>`).join('')}</ul>`:'<div class="empty">Không tìm thấy dữ liệu phù hợp.</div>',`<button class="btn" id="closeSearch">Đóng</button>`);$('#closeSearch').onclick=closeModal;$$('[data-search-go]').forEach(b=>b.onclick=()=>{closeModal();go(b.dataset.searchGo)})}
    function showQuickAdd(){openModal('Thêm nhanh',`<div class="grid-3"><button class="btn" data-quick="task">✓ Công việc</button><button class="btn" data-quick="event">▦ Lịch hoạt động</button><button class="btn" data-quick="activity">⚑ Hoạt động Đội</button><button class="btn" data-quick="incident">＋ Ghi nhận</button><button class="btn" data-quick="plan">▤ Kế hoạch</button><button class="btn" data-quick="class">♙ Lớp học</button></div><div class="notice mt">Phím tắt: Ctrl + Enter để mở thêm nhanh; Ctrl + K để tìm kiếm.</div>`,`<button class="btn" id="closeQuick">Đóng</button>`);$('#closeQuick').onclick=closeModal;$$('[data-quick]').forEach(b=>b.onclick=()=>{const x=b.dataset.quick;closeModal();if(x==='task')taskForm();if(x==='event')eventForm();if(x==='activity')entityForm('activities');if(x==='incident')openQuickIncident();if(x==='plan')entityForm('plans');if(x==='class')classForm()})}
    function download(content,name,type){const blob=content instanceof Blob?content:new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}

    async function showOnboarding(){let step=0;const data={school:'',code:'',address:'',campuses:['Cơ sở 1','Cơ sở 2'],year:'2026–2027',start:'2026-08-15',end:'2027-05-31',mode:'local'};const render=()=>{const titles=['Thông tin trường','Các cơ sở','Năm học','Danh sách lớp','Giáo viên chủ nhiệm','Bộ tiêu chí','Công việc định kỳ','Chế độ dữ liệu','Sẵn sàng sử dụng'];let body='';if(step===0)body=`<div class="form-grid"><div class="field full"><label class="required">Tên trường</label><input id="wSchool" value="${esc(data.school)}" placeholder="TRƯỜNG THCS…"></div><div class="field"><label>Mã trường</label><input id="wCode" value="${esc(data.code)}"></div><div class="field"><label>Địa chỉ khái quát</label><input id="wAddress" value="${esc(data.address)}"></div></div>`;if(step===1)body=`<div class="field"><label>Tên cơ sở, mỗi dòng một cơ sở</label><textarea id="wCampuses">${esc(data.campuses.join('\n'))}</textarea></div>`;if(step===2)body=`<div class="form-grid"><div class="field full"><label>Năm học</label><input id="wYear" value="${esc(data.year)}"></div><div class="field"><label>Bắt đầu</label><input type="date" id="wStart" value="${data.start}"></div><div class="field"><label>Kết thúc</label><input type="date" id="wEnd" value="${data.end}"></div></div>`;if(step===3)body=`<p>Thầy có thể nhập danh sách lớp ngay sau khi hoàn tất tại <strong>Thiết lập → Danh sách lớp</strong>.</p><div class="notice">Hệ thống hỗ trợ CSV và dán trực tiếp từ Excel, có xem trước và kiểm tra dòng lỗi.</div>`;if(step===4)body=`<p>Thông tin tối thiểu gồm họ tên giáo viên và lớp phụ trách; số điện thoại/email là tùy chọn. Có thể cập nhật cùng danh sách lớp.</p>`;if(step===5)body=`<div class="notice warn">Bộ tiêu chí mẫu chỉ mang tính tham khảo, cần nhà trường phê duyệt trước khi sử dụng.</div><label class="check-row"><input id="wUseCriteria" type="checkbox" checked> Giữ bộ tiêu chí mẫu để chỉnh sửa</label>`;if(step===6)body=`<p>Thư viện đã có mẫu công việc tuần, tháng và năm học. Sau khi hoàn tất, vào <strong>Công việc và checklist → Thư viện mẫu</strong> để chọn.</p>`;if(step===7)body=`<label class="check-row"><input type="radio" checked> Chỉ dùng cục bộ trên thiết bị này</label><label class="check-row mt"><input type="radio" disabled> Đồng bộ cá nhân (cần cấu hình backend an toàn)</label>`;if(step===8)body=`<div class="notice"><strong>Checklist sẵn sàng</strong><ul><li>${data.school?'✓':'○'} Tên trường</li><li>✓ ${data.campuses.length} cơ sở</li><li>✓ Năm học và 40 tuần</li><li>○ Danh sách lớp thật — có thể nhập sau</li><li>○ Bản sao lưu đầu tiên — tạo sau khi hoàn tất cấu hình</li></ul></div>`;openModal(`${step+1}/9 • ${titles[step]}`,`<div class="wizard-steps">${Array.from({length:9},(_,i)=>`<span class="${i<step?'done':i===step?'active':''}"></span>`).join('')}</div>${body}`,`<button class="btn" id="wizardBack" ${step===0?'disabled':''}>Quay lại</button><button class="btn" id="wizardSkip">${step===8?'Để sau':'Bỏ qua'}</button><button class="btn primary" id="wizardNext">${step===8?'Hoàn tất':'Tiếp tục'}</button>`,true);$('#modalClose').style.display='none';$('#wizardBack').onclick=()=>{capture();step--;render()};$('#wizardSkip').onclick=()=>{if(step===8)finish();else{capture();step++;render()}};$('#wizardNext').onclick=()=>{if(step===0&&!$('#wSchool').value.trim())return toast('Hãy nhập tên trường hoặc chọn Bỏ qua.','bad');capture();if(step<8){step++;render()}else finish()};function capture(){if(step===0){data.school=$('#wSchool')?.value.trim()||data.school;data.code=$('#wCode')?.value.trim()||'';data.address=$('#wAddress')?.value.trim()||''}if(step===1)data.campuses=$('#wCampuses')?.value.split('\n').map(x=>x.trim()).filter(Boolean)||data.campuses;if(step===2){data.year=$('#wYear')?.value.trim()||data.year;data.start=$('#wStart')?.value||data.start;data.end=$('#wEnd')?.value||data.end}}async function finish(){const school=(await db.all('schools'))[0];if(data.school)await db.put('schools',{...school,name:data.school,code:data.code,address:data.address,is_sample:false});const oldCampuses=await db.all('campuses');for(let i=0;i<data.campuses.length;i++){if(oldCampuses[i])await db.put('campuses',{...oldCampuses[i],name:data.campuses[i],is_sample:false});else await db.put('campuses',{name:data.campuses[i],code:`CS${i+1}`})}await setting('onboarded',true);$('#modalClose').style.display='grid';closeModal();await loadContext();toast('Đã hoàn tất thiết lập ban đầu');go('dashboard')}};render()}

    boot();
  })();
  </script>
